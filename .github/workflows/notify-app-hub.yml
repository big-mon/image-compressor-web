name: Notify App Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify App Hub to publish
        env:
          GH_TOKEN: ${{ secrets.APP_HUB_DISPATCH_TOKEN }}
        run: |
          : "${GH_TOKEN:?APP_HUB_DISPATCH_TOKEN is not set}"
          gh api --method POST repos/big-mon/app-hub/dispatches \
            -f event_type=tool_updated \
            -f "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
