<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="description" content="JPEG・PNG・WebPをブラウザ内でトリミング、回転、反転、リサイズ、圧縮。画像を外部へアップロードせず、メタデータを削除して保存できます。" />
    <link rel="canonical" href="https://app.damonge.com/image-compressor-web/" />
    <title>画像圧縮・トリミングをブラウザで | image-compressor-web</title>
    <style>
      .static-content {
        width: min(calc(100% - 2rem), 56rem);
        margin: 0 auto 2rem;
        padding: 1rem 1.1rem 1.2rem;
        border: 1px solid #2b3a3e;
        border-radius: 0.8rem;
        background: #141c1f;
        color: #c2d0d2;
        font: 0.875rem/1.65 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .static-content summary,
      .static-content p {
        margin: 0;
      }

      .static-content summary {
        cursor: pointer;
        padding-block: 0.5rem;
        color: #f4f8f8;
        font-size: 1.1rem;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }

      .static-content p + p {
        margin-top: 0.45rem;
      }

      .static-content-kicker {
        margin-bottom: 0.25rem !important;
        color: #92e2c4;
        font-size: 0.7rem;
        font-weight: 750;
        letter-spacing: 0.12em;
      }

      .static-content a {
        color: #92e2c4;
        text-underline-offset: 0.2em;
      }

      .static-content a:focus-visible {
        outline: 3px solid #92e2c4;
        outline-offset: 3px;
      }
    </style>
    <noscript>
      <style>
        #root:empty {
          min-height: 0;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <details class="static-content" open>
      <summary id="static-content-title">ブラウザ内で画像を整える</summary>
      <p class="static-content-kicker">IMAGE-COMPRESSOR-WEB</p>
      <p>JPEG・PNG・WebPの静止画を、画像データを外部へアップロードせずにトリミング、回転、反転、リサイズ、圧縮できます。</p>
      <p>公開ホストの通常のアクセス解析（Cloudflare Web Analytics）が利用される場合がありますが、画像処理とは別です。<a href="%BASE_URL%guide.html">使い方ガイド</a>で対応形式と出力の注意点を確認できます。編集にはJavaScriptが必要です。</p>
    </details>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
